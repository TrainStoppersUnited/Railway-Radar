<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Radar - Live UK Train Tracking</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="header">
        <h1>🚂 Railway Radar</h1>
        <p>Live UK Railway Information</p>
    </div>

    <div class="controls">
        <form class="search-form" role="search">
            <label for="search-input" class="sr-only">Search for railway information</label>
            <input type="search" id="search-input" name="query" placeholder="Search stations, trains...">
            <button type="submit">Search</button>
        </form>
        
        <div class="button-group">
            <button id="location-btn" onclick="requestUserLocation()">📍 Use My Location</button>
        </div>

        <div id="location-status">Location access: Not requested</div>
    </div>

    <div id="map"></div>

    <div id="train-info" class="train-info">
        <h3>Trains:</h3>
        <div id="train-list">
            <p>Enter a search query to find trains</p>
        </div>
    </div>

    <div id="search-results" class="search-results">
        <p>Search results will appear here</p>
    </div>

    <footer>
        <p>Railway Radar © 2026 | Live train tracking for UK railways</p>
        <p><small>Data provided by National Rail Enquiries.</small></p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>  
</body>
</html>
